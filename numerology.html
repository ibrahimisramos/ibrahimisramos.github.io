            "22": {"Good Description": "turning dreams into reality through practical application; to reach higher level of consciousness, driven to build, create or promote something to benefit the community or humanity as a whole. Visionary, inventive, inspirational, forward thinking, focused, dedicated, idealistic, creative, intuitive, charismatic", "Not So good Description": "controlling, inflexible, workaholic, self-destructive, awkward, stubborn, arrogant, demanding, self-righteous", "Lessons": "embrace and surrender to change, make time for fun & relaxation, think outside the box, express emotion and affection, embrace gradual progress. To understand and utilize their creative power; to live with honesty and integrity; to embrace their spirituality and universal laws; to utilise their Master Number energy; to balance materialism and spirituality; to serve humanity and promote unconditional love; to help raise the collective consciousness of the world.", "Soul Desire": "Long to be a Master Builder who turns dreams into reality through practical application. Desire to build, create, or promote something that benefits humanity and bridges the spiritual and material worlds. Motivated by big projects and challenges that enable you to make a difference in the workplace, community, or world at large."},

        const numbers = {
            "1": {"1": "For people with only one Number 1 in their charts, it's extremely difficult to express their innermost feelings and desires. They are unable to convey their true feelings, even though they may not necessarily be bad at communication at other levels. It will also be hard for them to be able to appreciate other person's point of view.", "11": "Comparatively much balanced in their approach, people with two Number 1s in their charts find it easy to communicate and express their inner feelings. They have an ability to look at life in an unbiased manner and are better judges of other people's point of views. This is also considered as the best quantity of Number 1s to have.", "111": "Such people may have a duality when it comes to their personality. But one thing is for sure that such people are outgoing and entertaining (many famous entertainers have this combo). Coming back to the ambivalence - people with three Number 1s may either be complete chatterboxes or they may be quiet and introspective. The truth is that they are actually both, and their personality manifestation depends on situation.", "1111": "Sensitive and caring, such people are frequently misunderstood, as they tend to be quite inexpressive. Verbal expression is not one of their better qualities, because of which they tend to be misfits among groups and find it hard to relax and simply let go.", "Many": "Too many Number 1s in the chart isn't a very good indication. An absence of ability to verbally express oneself is stark in these natives, and they may even face enormous difficulty on account of this. They also stand a high chance of being misunderstood due to this inability. Such people, however, may be very creative and may use such forms for inner-expression like music, dance or painting."},

            "3": {"3": "An excellent memory and a marked creative streak are the prominent gains of people who possess one Number 3 in their Numerology chart. A positive, yet a practical, realistic approach towards the attainment of their goals and an honest optimism towards life set them apart from others, and even make them a source of inspiration for others.", "33": "Mentally alert and creative, such people are quite imaginative and love their eccentricity and a crazy streak that allows them to be unconventional. Giving the native an ability to express well in words, this combination allows people to excel in creative and literary fields, and many such people may be writers.", "333": "Three 3s may be counted as too many, for they make the native extra-imaginative, so much so that the native may remain self-absorbed and prefer to live in his/her own imagination. Such people appear as aloof and remote and find it hard to relate to others and usually are bad listeners.", "3333": "This rarely found combination makes the natives extremely impractical, timid, fearful and super dreamy. The imagination of these people tends to be so strong that it is difficult for them to step out of it into the real world and confront the day-to-day chores and demands of routine.", "Many": "Too many 3s in the chart may indicate a scattered brain... not grounded."},
            "4": {"4": "People with this combination in their Numerology chart tend to be practical, earthy and basically good with manual work. They tend to enjoy 'hands-on' approach and such vocations. A more than practically needed emphasis on theories and imagination makes them impatient. The digit also relates to work like handicrafts and pottery, and even instrumental music. Such people also are good organizers.", "44": "Born with excellent organizational skills, such people love the task of initiating a task and carrying it to the end. Accurate, conscientious and prim, these people make great managers, and may even be sculptors or someone great at origami. However they may be inclined to become overly involved in superficial, physical and materialistic pursuits at the expense of fun or spiritual pursuits.", "444": "Almost exclusively given to material, practical and physical pursuits, people with such a combination find it hard to attend to any other sphere of their lives. Organized to the T, these people are self-disciplined and hard working. Their abilities may be apparent to others, but they themselves may frequently be unable to realise their natural talents.", "4444": "An extremely rare placement, it is rarely found. Such people, if any, are totally immersed in physical activities. Anything to do with intellectual or spiritual domain is beyond their understanding. They also possess enormous capability at any task that needs working using hands.", "Many": "Too many 4s may indicate being overworked and a workaholic."},
            "5": {"5": "Emotionally stable and balanced, people with one Number 5 in their chart find it easy to motivate and inspire others. Their compassionate and caring nature allows them to positively reinforce others in a manner that makes them achieve and perform much more than they otherwise would have.", "55": "Intense, emotional and determined, people with two 5s in their Numerology chart tend to be extremely enthusiastic and driven about whatever they do or possess. This generally makes them passionate, and sometimes even obsessed. This may lead to certain regrettable situations and outbursts.", "555": "Loving adventure, these people really need to channelise this vast reserve in the right direction. They tend to speak without contemplating, which may put them in tricky situations, wherein they might have hurt others unintentionally. They love any passionate activity and enjoy change.", "5555": "This combination is possible only three times in a span of a century (100 years). Hence, this is obvious that people with this combination are very rare. It's a dangerous combination to have, as it makes one prone to accidents.", "Many": "Too many 5s - best to marry later. They cannot settle at young age: wants to enjoy life, take risks. Watch out for vices and compulsive behaviours."},

        let listNumbers = ["", "", "", "", "", "", "", "", "", ""];
        let missingNumbers = [];

        function charPosition(letter) {
            return ((letter.charCodeAt(0) - 97) % 9) + 1;
        }

        function isVowel(c) {
            return ['a', 'e', 'i', 'o', 'u'].includes(c);
        }

        function isConsonant(c) {
            return /^[bcdfghjklmnpqrstvwxyz]$/.test(c);
        }

        function getReduced(number) {
            let val = 0;
            let numList = String(number).split('').map(Number);
            for (let n of numList) {
                val += n;
            }
            if (val >= 10 && ![11, 22, 33].includes(val)) {
                return getReduced(val);
            }
            return val;
        }

        function getReducedNumber(birthSum) {
            const specialNumbers = [11, 22, 33];
            let num = String(birthSum) + "|";
            while (String(birthSum).length != 1) {
                if (specialNumbers.includes(parseInt(birthSum))) {
                    num += String(birthSum);
                }
                let temp = 0;
                for (let i of String(birthSum)) {
                    temp += parseInt(i);
                }
                birthSum = String(temp);
            }
            return num + "|" + String(birthSum);
        }

        function updateListNumbers(i) {
            let pos = charPosition(i);
            listNumbers[pos] = listNumbers[pos] + String(pos);
        }

        function getScoresIndividual(name) {
            let scoreVowels = 0;
            let scoreConst = 0;
            for (let n of name.replace(/\s/g, '').toLowerCase()) {
                if (isConsonant(n)) {
                    scoreConst += charPosition(n);
                } else if (isVowel(n)) {
                    scoreVowels += charPosition(n);
                }
            }
            return [getReducedNumber(scoreVowels), getReducedNumber(scoreConst)];
        }

        function fullNameScore(fullName) {
            let score = 0;
            for (let i of fullName.replace(/\s/g, '').toLowerCase()) {
                score += charPosition(i);
                updateListNumbers(i);
            }
            return getReducedNumber(score);
        }

        function getLifePathScore(day, month, year) {
            let score = getReduced(day) + getReduced(month);
            for (let digit of String(year)) {
                score += parseInt(digit);
            }
            score = getReduced(score);
            return score;
        }

        function getDetailsOutListNumbers(number) {
            for (let digit of String(number)) {
                let d = parseInt(digit);
                if (d > 0) {
                    listNumbers[d] = listNumbers[d] + String(d);
                }
            }
        }

        function getLifePath(date) {
            let personality = getReduced(date.getDate());
            let lifePathNum = getLifePathScore(date.getDate(), date.getMonth() + 1, date.getFullYear());
            getDetailsOutListNumbers(date.getFullYear());
            getDetailsOutListNumbers(date.getMonth() + 1);
            getDetailsOutListNumbers(date.getDate());
            getDetailsOutListNumbers(lifePathNum);
            return [lifePathNum, personality];
        }

        function getRelatedNumbersFromName(name) {
            let destinyNum = fullNameScore(name);
            let [innerPersonalityNum, wantToBePerceivedNum] = getScoresIndividual(name);
            let finalDestiny = destinyNum.split('|').pop();
            getDetailsOutListNumbers(finalDestiny);
            return [destinyNum, innerPersonalityNum, wantToBePerceivedNum];
        }

        function getPersonalYear(birthDate) {
            let today = new Date();
            let thisYearBday = String(birthDate.getDate()) + String(birthDate.getMonth() + 1) + String(today.getFullYear());
            return getReduced(thisYearBday);
        }

            let [destinyNum, innerPersonalityNum, wantToBePerceivedNum] = getRelatedNumbersFromName(name);
            let [lifePathNum, personality] = getLifePath(dob);
            let personalYearNum = getPersonalYear(dob);

            for (let i = 1; i <= 9; i++) {

                    missingNumbers.push(String(i));
                }
            }

            displayReport(name, dobInput, lifePathNum, destinyNum, innerPersonalityNum, wantToBePerceivedNum, personality, personalYearNum);
            
            // Save anonymous data to Google Sheets
            saveAnonymousData(dob.getFullYear(), listNumbers.slice(1), lifePathNum, personality);
        }

            try {

            function checkPageBreak(needed = 20) {
                if (y + needed > pageHeight) {
                    doc.addPage();
                    y = 20;
                    return true;
                }
                return false;
            }
            
            // Helper function to wrap text
            function addWrappedText(text, x, yPos, maxW, lineHeight = 6) {
                const lines = doc.splitTextToSize(text, maxW);
                doc.text(lines, x, yPos);
                return lines.length * lineHeight;

            // Helper to add section header

            y += addWrappedText(numbersDescription[String(personalYearNum)]['Lessons'], margin, y, maxWidth);
            
            doc.save(`${name}-${dobInput}.pdf`);
        }
    </script>
</body>
</html>
