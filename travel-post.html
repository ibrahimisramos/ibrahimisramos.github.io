<script src="travel/posts.js"></script>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('post');

  const post = (window.TRAVEL_POSTS || []).find(p => p.slug === slug);
  if (!post) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
    return;
  }

  document.title = post.title + ' — Ibrahim Sharul';
  document.getElementById('breadcrumb-title').textContent = post.title;
  document.getElementById('breadcrumb-post').textContent = post.title;

  fetch(post.file)
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(md => {
      const tags = (post.tags || []).map(t => `<span class="post-tag">${t}</span>`).join(' ');
      const cover = post.cover ? `<img src="${post.cover}" class="post-cover" alt="${post.title}">` : '';
      document.getElementById('post-content').innerHTML =
        cover +
        `<div class="post-meta">
          <span><i class="bi bi-calendar3"></i> ${post.date}</span>
          <span><i class="bi bi-geo-alt"></i> ${post.location}</span>
          ${tags}
        </div>` +
        marked.parse(md);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('post-content').style.display = 'block';
    })
    .catch(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    });
})();
</script>
